# =============================================================================
# XIAO nRF54LM20B battery level detection demo: nPM1300 PMIC + USBHS serial
#
# The board-level defconfig already enables and "auto-initializes at boot" the
# USB CDC-ACM serial backend (CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y, VID 2886:8013,
# product "XIAO_NRF54LM20B"); zephyr,console = cdc_acm_uart (over USBHS) is ready
# before main() runs. The application must therefore NOT manually create a second
# usbd context -- it would conflict with the auto backend and break USB enumeration.
#
# The nPM1300 charger/battery sensor driver CONFIG_NPM13XX_CHARGER is enabled by
# default when the pmic_charger DT node exists (it auto-selects I2C + MFD). The
# dependency chain is listed here explicitly.
# =============================================================================

# ---- GPIO (on-board RGB LED heartbeat) ----
CONFIG_GPIO=y

# ---- mcuboot: the image takes effect on first boot (boot_write_img_confirmed
#      is not called, same as the mic demo) ----
CONFIG_BOOTLOADER_MCUBOOT=y

# ---- DTR detection: used to tell whether the PC has opened the serial port;
#      only start reporting once it is open ----
CONFIG_UART_LINE_CTRL=y

# ---- nPM1300 PMIC: mfd + charger sensor + bit-banged I2C bus ----
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_NPM13XX_CHARGER=y
