# =============================================================================
# XIAO nRF54LM20B — "hi seeed" wakeword detection (Edge AI Lab + Axon NPU)
# Solution: 97021 (int16 mono PCM @16 kHz, 160-sample window, mel DSP, 3 classes)
#
# Console stays on the board-default USB CDC ACM (cdc_acm_uart): the board's
# cdc_acm_serial defconfig already enables SERIAL/CONSOLE/UART_CONSOLE/USB, so
# no console config is needed here and the 1200-bps DFU trigger keeps working.
# =============================================================================

# ---- nRF Edge AI runtime + Axon NPU model ----
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
# Axon buffer sizes from the generated prj_example.conf (solution 97021)
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=6656
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# ---- nRF Edge AI runtime dependencies ----
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
# printf()/printk() float formatting for probability values
# (printk goes through cbprintf in Zephyr 4.x)
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ---- console / serial ----
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_UART_LINE_CTRL=y

# ---- mcuboot self-confirmation: an uploaded image starts as a test image
#      (unconfirmed, would be reverted). The app confirms itself at startup
#      so the image stays permanent after a reset. ----
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# ---- PDM2 digital microphone (pdm20, nordic,nrf-pdm) ----
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y
CONFIG_NRFX_PDM=y

# ---- PMIC nPM1300 + bit-bang I2C + regulators: power LDO1 (dmic_vdd) ----
# LDO1 powers the onboard mic (shared with the IMU); it must be boot-on
# (see app.overlay).
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# ---- LED feedback + runtime checks ----
CONFIG_GPIO=y
CONFIG_ASSERT=y

# The wakeword loop runs mel DSP + NPU inference every 10 ms from the main
# thread; keep headroom in the stacks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Silence the chatty USB UDC (dwc2) driver INFO logs at boot.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# ---- DEBUG (diagnosing recurring PDM stream stop): surface the nrfx PDM
#      driver's stop reason (slab alloc fail / RX queue full / DMA buffer
#      error) with boot timestamps; everything else stays at ERR level.
#      Deferred mode (default): logs are emitted from the log thread, so
#      ERR logs from the PDM ISR cannot deadlock the console. ----
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_AUDIO_DMIC_LOG_LEVEL_ERR=y
