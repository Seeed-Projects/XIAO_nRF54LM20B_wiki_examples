# =============================================================================
# XIAO nRF54LM20B BLE Advertising Demo (connectable peripheral)
#
# Single-core Bluetooth stack: host + Zephyr software controller
# (BT_LL_SW_SPLIT). In this Zephyr 4.4 release CONFIG_BT_CTLR no longer exists;
# the controller is enabled via a devicetree node -- see app.overlay
# (bt_hci_controller, compatible "zephyr,bt-hci-ll-sw-split", under &radio,
# chosen zephyr,bt-hci). The board dtsi leaves &ieee802154 okay by default and
# it shares the same RADIO, so it is disabled here.
#
# The board defconfig auto-initialises USB CDC-ACM at boot, so zephyr,console =
# cdc_acm_uart is ready before main(); do not build a second usbd context.
# =============================================================================

# ---- Bluetooth: host + peripheral (advertising) role ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_BLE_ADV"

# ---- Bluetooth controller: Zephyr software controller (enabled via DT node) ----
CONFIG_BT_LL_SW_SPLIT=y

# ---- Workaround: GCC 8.2 toolchain lacks GCC12 "asm inline"; hal/debug.h's
#      LL_ASSERT under ASSERT_OPTIMIZE_FOR_SIZE fails to compile. Disable it. ----
CONFIG_BT_CTLR_ASSERT_OPTIMIZE_FOR_SIZE=n

# ---- Disable 802.15.4 and yield the RADIO to the BLE controller ----
CONFIG_IEEE802154=n

# ---- GPIO for the RGB status LED (gpio-leds driver) ----
CONFIG_GPIO=y

# ---- mcuboot: image takes effect on boot ----
CONFIG_BOOTLOADER_MCUBOOT=y
