# =============================================================================
# XIAO nRF54LM20B IMU motion wake Demo: GPIO + USBHS serial + IMU (LSM6DS3TR-C)
#
# The board defconfig already enables and "auto-initializes at boot" the USB
# CDC-ACM serial backend (CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y, VID 2886:8013,
# product "XIAO_NRF54LM20B"); zephyr,console = cdc_acm_uart (over USBHS) is
# ready before main(). Therefore the application must NOT create a second usbd
# context manually, otherwise it conflicts with the auto backend and USB fails
# to enumerate.
#
# The shake detection in this demo does not rely on the sensor trigger API
# (the lsm6dsl driver only supports DATA_READY triggers, not wake-up triggers);
# instead it uses bare I2C to directly configure the wake-up registers of the
# LSM6DS3TR-C. Hence CONFIG_LSM6DSL_TRIGGER is NOT enabled here, leaving the
# IMU interrupt pin (P0.06) for the application to configure itself as a
# GPIO rising-edge interrupt + wake source.
# =============================================================================

# ---- GPIO (onboard RGB LED + IMU interrupt pin P0.06 wake) ----
CONFIG_GPIO=y

# ---- mcuboot: image defaults to "test" state after upload and takes effect on
#      run (same as the mic demo; boot_write_img_confirmed is not called to
#      avoid pulling in flash/IMG_MANAGER dependencies) ----
CONFIG_BOOTLOADER_MCUBOOT=y

# ---- IMU (Sense variant): LSM6DS3TR-C, compatible=st,lsm6dsl, alias imu0 ----
# The driver is only used for boot-stage WHO_AM_I validation / supply readiness;
# triggers are not enabled (see above).
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# PMIC nPM1300 + bit-bang I2C + regulators: power up imu_vdd (LDO1) (app.overlay
# adds regulator-boot-on so supply is ready before sensor init)
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
