# =============================================================================
# XIAO nRF54LM20A getting-started: GPIO + USB CDC serial + IMU
#
# Built WITHOUT mcuboot (no sysbuild, CONFIG_BOOTLOADER_MCUBOOT=n) so the image
# links at RRAM base 0x0 and is SWD-flashed directly with `nrfutil device
# program` -- no KMU signing key, no mcuboot child. The app.overlay deletes
# zephyr,code-partition to make the image link at 0x0.
#
# USB CDC-ACM console: provided by the `cdc-acm-console` snippet (-S on the
# west build line), which enables USB_DEVICE_STACK_NEXT +
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT + SERIAL/CONSOLE/UART_CONSOLE/UART_LINE_CTRL
# and adds a cdc_acm_uart node under &usbhs. zephyr,console is therefore the
# CDC ACM UART and is ready before main() runs -- the app must NOT build a
# second usbd context (that would break enumeration).
# Only GPIO / IMU / DTR options are set here.
# =============================================================================

# ---- No mcuboot: boot directly from RRAM at 0x0 (see app.overlay) ----
CONFIG_BOOTLOADER_MCUBOOT=n

# ---- GPIO (on-board RGB LED) ----
CONFIG_GPIO=y

# ---- DTR detection: the snippet enables UART_LINE_CTRL, but be explicit so
#      the greeting prints only after the PC opens the serial port. ----
CONFIG_UART_LINE_CTRL=y

# ---- IMU (Sense variant): LSM6DS3TR-C, compatible=st,lsm6dsl, alias imu0 ----
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LSM6DSL=y
# PMIC nPM1300 + bit-bang I2C + regulator: powers the imu_vdd (LDO1) rail
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_I2C_GPIO=y
