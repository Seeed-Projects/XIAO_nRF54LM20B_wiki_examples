# =============================================================================
# XIAO nRF54LM20B Mic Demo: PDM2 capture + button-triggered recording + serial audio stream
#
# The board defconfig already enables the USB CDC-ACM serial backend (auto-ready
# at boot); zephyr,console = cdc_acm_uart (over USBHS) serves as this demo's
# audio stream channel.
# Here we fill in GPIO / PDM-DMIC / PMIC (power LDO1 for the mic) Kconfig options.
# =============================================================================

# ---- GPIO (onboard RGB LED + User Button) ----
CONFIG_GPIO=y

# ---- DTR detection: used to tell whether the PC has opened the serial port ----
CONFIG_UART_LINE_CTRL=y

# ---- PDM2 / digital microphone (nordic,nrf-pdm = pdm20) ----
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y
CONFIG_NRFX_PDM=y

# ---- PMIC nPM1300 + bit-bang I2C + regulators: power LDO1 (imu_vdd/dmic_vdd) ----
# LDO1 powers both the IMU and the onboard mic; it must be boot-on (see app.overlay)
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
