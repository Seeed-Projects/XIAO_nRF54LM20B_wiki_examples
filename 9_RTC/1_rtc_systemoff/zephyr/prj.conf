# =============================================================================
# XIAO nRF54LM20B RTC demo 1: timestamp from build time + System OFF + GRTC
# alarm wake (port of the 20A wiki RTC demo).
#
# Structure: the "power management / System OFF / hwinfo / retained memory /
# CRC" block is the wiki prj.conf verbatim; the bootloader self-confirm and
# console blocks are this repo's 20B-verified additions (same as
# 4_imu/3_electronic_ocean and 8_AI_Wakeword).
#
# Dropped vs the wiki prj.conf: CONFIG_NEWLIB_LIBC=y. The 20A demo comment
# says it is needed "for sscanf, strcmp etc.", but the final rtc-main.c uses
# none of those (all date parsing is hand-rolled) -- printk %lld works via
# cbprintf (CBPRINTF_COMPLETE defaults to y).
# =============================================================================

# ---- mcuboot: image defaults to "test" state after upload ----
CONFIG_BOOTLOADER_MCUBOOT=y
# Self-confirm the running image at startup (boot_write_img_confirmed in
# main.c; same block as 8_AI_Wakeword, verified working).
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# ---- console / serial (board defconfig provides USB CDC ACM) ----
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# ---- Power management and System OFF (wiki, verbatim) ----
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# ---- Hardware info (reset cause detection: cold vs warm boot) ----
CONFIG_HWINFO=y

# ---- Retained memory (survives System OFF; see app.overlay) ----
CONFIG_RETAINED_MEM=y

# ---- CRC for retained data validation ----
CONFIG_CRC=y
