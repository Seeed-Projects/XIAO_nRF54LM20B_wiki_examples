# =============================================================================
# XIAO nRF54LM20B BLE Observer Demo
#
# Ported from NCS SDK samples/bluetooth/observer. Single-core Bluetooth stack:
# host + Zephyr software controller (BT_LL_SW_SPLIT); the controller HAL drives
# the nRF54LM20B RADIO peripheral via radio_nrf54lx (&radio is status="okay" in
# the board dtsi).
#
# In this Zephyr 4.4 release the old Kconfig master switch CONFIG_BT_CTLR no
# longer exists; the controller is now enabled via the devicetree: in app.overlay
# add a child node bt_hci_controller with compatible="zephyr,bt-hci-ll-sw-split"
# under &radio and set it okay, then point chosen zephyr,bt-hci at it. This sets
# DT_HAS_ZEPHYR_BT_HCI_LL_SW_SPLIT_ENABLED, BT_LL_SW_SPLIT (default y) takes
# effect, HAS_BT_CTLR is selected, and the controller link comes up.
#
# The board dtsi leaves &ieee802154 okay by default; it shares the same RADIO
# with BLE, so it is disabled here to yield the radio.
#
# The board defconfig already enables USB CDC-ACM serial and auto-initializes
# it at boot (CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y), so zephyr,console =
# cdc_acm_uart is ready before main(); the application must not manually build a
# second usbd context.
# =============================================================================

# ---- Bluetooth: host + observer role ----
CONFIG_BT=y
CONFIG_BT_OBSERVER=y

# ---- Bluetooth controller: Zephyr software controller (enabled via DT node, see app.overlay) ----
CONFIG_BT_LL_SW_SPLIT=y

# ---- Workaround: the GCC 8.2 toolchain does not support GCC12's "asm inline" qualifier.
#      hal/debug.h's LL_ASSERT uses __asm__ inline volatile under
#      ASSERT_OPTIMIZE_FOR_SIZE and fails to compile. Disable it and fall back to
#      the BT_ASSERT(cond) branch. ----
CONFIG_BT_CTLR_ASSERT_OPTIMIZE_FOR_SIZE=n

# ---- Disable 802.15.4 and yield the RADIO to the BLE controller ----
CONFIG_IEEE802154=n

# ---- GPIO for the RGB status LED (gpio-leds driver) ----
CONFIG_GPIO=y

# ---- mcuboot: image takes effect on boot (does not call boot_write_img_confirmed, consistent with other demos) ----
CONFIG_BOOTLOADER_MCUBOOT=y
