# =============================================================================
# XIAO nRF54LM20B Low Power Demo — System OFF (ultra-low-power)
#
# Ported from the Seeed XIAO nRF54LM20A "low_power" wiki page (mode 2).
# Bluetooth is OFF; the app suspends the external flash + SPI bus + console and
# calls sys_poweroff() to enter System OFF, woken by the BOOT button (P0.09).
#
# SPI_NOR binds the PY25Q128HA (jedec,spi-nor, label py25q128, enabled in the
# overlay) so pm_device_action_run(SUSPEND) can deep-power-down the part.
#
# The board defconfig auto-initialises USB CDC-ACM at boot; BOOT_BANNER is
# disabled to keep the boot log minimal before poweroff.
# =============================================================================

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y

CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWEROFF=y
CONFIG_HWINFO=y
CONFIG_CRC=y

CONFIG_BT=n

# ---- mcuboot: image takes effect on boot ----
CONFIG_BOOTLOADER_MCUBOOT=y
