; PlatformIO Project Configuration File
;
; XIAO nRF54LM20B Sense Edge AI — 5-class IMU gesture recognition
; (Nordic Edge AI Lab solution 96964, Axon NPU model).
;
; IMPORTANT: the generated model targets Edge AI runtime v3. Set
; XIAO_EDGE_AI_DIR to a local sdk-edge-ai v3.x clone before building, e.g.
;   XIAO_EDGE_AI_DIR=~/XIAO-EdgeAI/tools/sdk-edge-ai pio run
; (the platform builder auto-detects CONFIG_NRF_EDGEAI=y in prj.conf and
;  registers that directory as a Zephyr module).
[env:seeed-xiao-nrf54lm20b]
platform = SeeedStudio
framework = zephyr
board = seeed-xiao-nrf54lm20b
monitor_speed = 115200
; Sources are listed explicitly by zephyr/CMakeLists.txt (the model file lives
; outside the PlatformIO src glob), so let the Zephyr app target own the build.
board_build.zephyr.app_build_control = true
build_src_filter = -<*>
