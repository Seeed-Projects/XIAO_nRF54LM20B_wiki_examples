# =============================================================================
# XIAO nRF54LM20B Low Power Demo — System ON Sleep
#
# Ported from the Seeed XIAO nRF54LM20A "low_power" wiki page (mode 1).
# Single-core BLE stack: host + Zephyr software controller (BT_LL_SW_SPLIT);
# the controller HAL drives the nRF54LM20B RADIO via radio_nrf54lx.
#
# In Zephyr 4.4 the old CONFIG_BT_CTLR master switch no longer exists; the
# controller is enabled via devicetree (see app.overlay). BT_LL_SW_SPLIT is kept
# for clarity. &ieee802154 shares the RADIO and is disabled in the overlay.
#
# ARM_MPU is disabled to cut MPU leakage and let the power manager select the
# deepest System ON idle state unconditionally. PM_DEVICE + PM_DEVICE_RUNTIME let
# the power policy suspend idle peripherals automatically between events.
#
# The board defconfig auto-initialises USB CDC-ACM at boot
# (CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y), so printk lands on cu.usbmodem* with no
# extra usbd setup; the app must not build a second usbd context.
# =============================================================================

# ---- BLE: broadcaster only (non-connectable 1 Hz advertising) ----
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="XIAO_LP_ON"
CONFIG_BT_LL_SW_SPLIT=y

# ---- Workaround: GCC 8.2 toolchain cannot compile GCC12 "asm inline" in
#      hal/debug.h LL_ASSERT under ASSERT_OPTIMIZE_FOR_SIZE. Disable it. ----
CONFIG_BT_CTLR_ASSERT_OPTIMIZE_FOR_SIZE=n

# ---- Disable 802.15.4 (shares RADIO with BLE; disabled in overlay too) ----
CONFIG_IEEE802154=n

# ---- Low-power plumbing ----
CONFIG_ARM_MPU=n
CONFIG_POWEROFF=y
CONFIG_HWINFO=y
CONFIG_CRC=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ---- GPIO for the boot-time LED pulse ----
CONFIG_GPIO=y

# ---- mcuboot: image takes effect on boot ----
CONFIG_BOOTLOADER_MCUBOOT=y
