# =============================================================================
# XIAO nRF54LM20B IMU demo 1: 6-axis data stream (LSM6DS3TR-C, simplest case)
#
# Prints accel (g) + gyro (dps) over the USB CDC console at 10 Hz; shake the
# board and the values move. main.c does nothing but fetch/get/print.
#
# The board defconfig already enables and "auto-initializes at boot" the USB
# CDC-ACM serial backend (product "XIAO_NRF54LM20B"); zephyr,console =
# cdc_acm_uart is ready before main(). Do NOT create a second usbd context.
#
# ODR / full-scale are set here at compile time -- the driver applies them at
# init (POST_KERNEL), so main.c needs no sensor_attr_set() runtime calls.
# =============================================================================

# ---- mcuboot: image defaults to "test" state after upload ----
CONFIG_BOOTLOADER_MCUBOOT=y

# ---- IMU (Sense variant): LSM6DS3TR-C, compatible=st,lsm6dsl, alias imu0 ----
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# ODR (index): 4 = 104 Hz, high enough that a shake is never missed
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_GYRO_ODR=4
# Full scale: +/-4g (shake without clipping), +/-2000dps
CONFIG_LSM6DSL_ACCEL_FS=4
CONFIG_LSM6DSL_GYRO_FS=2000
# PMIC nPM1300 + bit-bang I2C + regulators: power up imu_vdd (LDO1) at boot
# (app.overlay adds regulator-boot-on + startup-delay-us so supply is ready
# before sensor init)
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
# ---- init order fix (verified on hardware): the sensor driver's default
# POST_KERNEL priority (90) runs BEFORE the nPM1300 regulator drivers
# (REGULATOR_NPM13XX_*_INIT_PRIORITY = 91/92), so imu_vdd (LDO1) is still
# off when lsm6dsl probes WHO_AM_I -> "device not ready". Move sensors after
# the regulators: 95 > 92.
CONFIG_SENSOR_INIT_PRIORITY=95

# ---- float printf for the sensor readouts ----
CONFIG_CBPRINTF_FP_SUPPORT=y
