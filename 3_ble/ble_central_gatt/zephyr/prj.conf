# =============================================================================
# XIAO nRF54LM20B BLE Central / GATT Write Demo
#
# Board scans as a central, connects to a peripheral, discovers its GATT
# services and writes an incrementing byte to the first writable characteristic.
#
# Single-core BLE stack: host + Zephyr software controller (BT_LL_SW_SPLIT),
# controller enabled via the app.overlay bt_hci_controller node (see notes in
# ble_advertising/zephyr/prj.conf). &ieee802154 disabled to free the RADIO.
# USB CDC-ACM console auto-initialised by the board (printk -> cu.usbmodem*).
# =============================================================================

# ---- Bluetooth: host + central + GATT client ----
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y

# ---- ACL/L2CAP buffers sized for GATT writes (match upstream sample) ----
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_L2CAP_TX_MTU=247

# ---- Bluetooth controller: Zephyr software controller (enabled via DT node) ----
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_ASSERT_OPTIMIZE_FOR_SIZE=n

# ---- Disable 802.15.4 and yield the RADIO to the BLE controller ----
CONFIG_IEEE802154=n

# ---- GPIO for the RGB status LED ----
CONFIG_GPIO=y

# ---- mcuboot ----
CONFIG_BOOTLOADER_MCUBOOT=y
