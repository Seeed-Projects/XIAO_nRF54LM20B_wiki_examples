CONFIG_SPI_NOR=n

# Increase Main and shell stack sizes to avoid stack overflow
# while using CRACEN
CONFIG_MAIN_STACK_SIZE=2048

# --- MINIMAL DIAGNOSTIC build (single CDC instance) ---
# Console ON + heartbeat on the single cdc_acm_uart so we can confirm over USB
# that the firmware is booting and console-over-CDC works.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# USB CDC ACM stack (nRF54L uses the "next" device stack), single instance.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# --- Logging: main.c uses LOG_INF() for the diagnostic heartbeat.
# Without CONFIG_LOG=y these calls compile to nothing -> no console output.
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Silence the chatty USB driver (udc_dwc2 "Prepare RX" spam) so the CDC stream
# is readable for Spinel HDLC frames; keep app/openthread logs.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
