SB_CONFIG_MATTER=y

# Use the shipped USB firmware loader's slot-0 layout (starts at 0x6000).
SB_CONFIG_PARTITION_MANAGER=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# The Matter sysbuild generator is controlled by this sysbuild option; the
# legacy CONFIG_CHIP_FACTORY_DATA_BUILD setting does not disable it in NCS 3.3.
SB_CONFIG_MATTER_FACTORY_DATA_GENERATE=n
