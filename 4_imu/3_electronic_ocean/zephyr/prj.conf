# =============================================================================
# XIAO nRF54LM20B IMU demo 3: "Electronic Ocean"
# 6x10 WS2812 matrix water simulation driven by the IMU (LSM6DS3TR-C).
#
# Rebuilt around the hardware-verified 1_6axis_data configuration after the
# 2026-10-27 "no serial, no LED after flash" failure: every block below is
# copied from a project that ran on this board (base = 1_6axis_data, console
# block = 6_zephyr-epaper, WS2812 = the only new addition). What was dropped
# vs the failed build: CONFIG_LOG entirely (printk instead, like 6axis),
# LOG_MODE_IMMEDIATE, CBPRINTF_COMPLETE, FAULT_DUMP.
# =============================================================================

# ---- mcuboot: image defaults to "test" state after upload ----
CONFIG_BOOTLOADER_MCUBOOT=y
# Self-confirm the running image at startup (boot_write_img_confirmed in
# main.c; same block as 8_AI_Wakeword, verified working).
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# ---- console / serial (copied from 6_zephyr-epaper, verified working) ----
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# ---- IMU (1_6axis_data, verified working): LSM6DS3TR-C on i2c30 ----
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# ODR (index): 4 = 104 Hz (applied by the driver at init, like 6axis)
CONFIG_LSM6DSL_ACCEL_ODR=4
# PMIC nPM1300 + bit-bang I2C + regulators: power up imu_vdd (LDO1) at boot
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
# Init order fix (verified on hardware): sensors must init AFTER the nPM1300
# regulator drivers (91/92), otherwise the IMU is not ready.
CONFIG_SENSOR_INIT_PRIORITY=95

# ---- float printf for the IMU readouts (printk via cbprintf) ----
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---- 6x10 WS2812 matrix on spi24 (MOSI P1.0 = XIAO D0) ----
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# ---- headroom (same as 8_AI_Wakeword) ----
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
