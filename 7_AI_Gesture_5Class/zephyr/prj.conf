# =============================================================================
# XIAO nRF54LM20B Sense — 5-class IMU gesture recognition (Axon NPU)
# Model: Nordic Edge AI Lab solution 96964 / session 64392
#
# Console stays on the board-default USB CDC ACM (cdc_acm_uart): the board's
# cdc_acm_serial defconfig already enables SERIAL/CONSOLE/UART_CONSOLE/USB, so
# no console config is needed here and the 1200-bps DFU trigger keeps working.
# =============================================================================

# ---- nRF Edge AI runtime + Axon NPU model ----
CONFIG_NRF_EDGEAI=y
CONFIG_NRF_AXON=y
# Axon buffer sizes from the generated prj_example.conf (solution 96964)
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=80
CONFIG_NRF_AXON_PSUM_BUFFER_SIZE=0

# ---- nRF Edge AI runtime dependencies ----
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y
# printf()/printk() float formatting for confidence values
# (printk goes through cbprintf in Zephyr 4.x)
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ---- console / serial ----
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_UART_LINE_CTRL=y

# ---- mcuboot self-confirmation: an uploaded image starts as a test image
#      (unconfirmed, would be reverted). The app confirms itself at startup
#      so the image stays permanent after a reset. ----
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# ---- IMU (Sense variant): LSM6DS3TR-C, compatible=st,lsm6dsl, alias imu0 ----
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LSM6DSL=y
# PMIC nPM1300 + bit-bang I2C + regulator: powers the imu_vdd (LDO1) rail
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_I2C_GPIO=y

# ---- LED feedback + runtime checks ----
CONFIG_GPIO=y
CONFIG_ASSERT=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Silence the chatty USB UDC (dwc2) driver INFO logs at boot.
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
